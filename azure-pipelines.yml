# Pipeline CI/CD de IT Incident Hub (Azure Pipelines)
# Corre en el agente autohospedado del pool "SelfHosted".
#
# Estrategia de release:
#   - Ramas feature/fix/refactor/chore -> solo CI (build, pruebas, seguridad, artefacto)
#   - main                             -> CI + despliegue automatico a QA
#   - tag vX.Y.Z                       -> CI + QA + aprobacion manual + Produccion

trigger:
  branches:
    include: [ main, feature/*, fix/*, refactor/*, chore/* ]
  tags:
    include: [ 'v*' ]

pool:
  name: SelfHosted

variables:
  nodeVersion: '20.x'

stages:
  - stage: CI
    displayName: 'CI: build, pruebas, seguridad y artefacto'
    jobs:
      - job: Build
        steps:
          - checkout: self
            clean: true

          - task: NodeTool@0
            displayName: 'Instalar Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          - script: npm ci
            displayName: 'Backend: instalar dependencias (npm ci)'
            workingDirectory: backend

          - script: npm run lint
            displayName: 'Backend: lint'
            workingDirectory: backend

          - script: npm test
            displayName: 'Backend: pruebas unitarias'
            workingDirectory: backend

          - task: PublishTestResults@2
            displayName: 'Publicar resultados de pruebas'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'backend/reports/junit.xml'
              failTaskOnMissingResultsFile: false

          - script: npm audit --omit=dev --audit-level=high
            displayName: 'Backend: auditoria de dependencias (produccion, high+)'
            workingDirectory: backend

          - script: npm ci && npm run build
            displayName: 'Frontend: instalar y compilar'
            workingDirectory: frontend

          - script: npm audit --omit=dev --audit-level=high
            displayName: 'Frontend: auditoria de dependencias (produccion, high+)'
            workingDirectory: frontend

          - task: CopyFiles@2
            displayName: 'Preparar paquete'
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)'
              Contents: |
                backend/src/**
                backend/package.json
                backend/package-lock.json
                backend/.env.example
                frontend/dist/**
                database/**
                tests/smoke.js
                devops/validar-despliegue.js
              TargetFolder: '$(Build.ArtifactStagingDirectory)/incident-hub'

          - task: ArchiveFiles@2
            displayName: 'Empaquetar (zip)'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/incident-hub'
              includeRootFolder: true
              archiveType: zip
              archiveFile: '$(Build.ArtifactStagingDirectory)/incident-hub-$(Build.BuildNumber).zip'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefacto'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/incident-hub-$(Build.BuildNumber).zip'
              artifact: 'incident-hub'

  - stage: QA
    displayName: 'Despliegue a QA'
    dependsOn: CI
    condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/tags/v')))
    variables:
      - group: incident-hub-secrets
    jobs:
      - deployment: DeployQA
        displayName: 'Desplegar y validar en QA'
        environment: 'incident-hub-qa'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: NodeTool@0
                  inputs:
                    versionSpec: $(nodeVersion)
                - task: ExtractFiles@1
                  displayName: 'Extraer artefacto'
                  inputs:
                    archiveFilePatterns: '$(Pipeline.Workspace)/incident-hub/*.zip'
                    destinationFolder: '$(Pipeline.Workspace)/deploy-qa'
                    cleanDestinationFolder: true
                - script: node -e "if(!process.env.DATABASE_URL){console.error('Falta el secreto DATABASE_URL');process.exit(1)}console.log('Secreto DATABASE_URL disponible (valor oculto)')"
                  displayName: 'Verificar secretos del ambiente'
                  env:
                    DATABASE_URL: $(DATABASE_URL)
                - script: npm ci --omit=dev
                  displayName: 'Instalar dependencias de produccion'
                  workingDirectory: '$(Pipeline.Workspace)/deploy-qa/incident-hub/backend'
                - script: node devops/validar-despliegue.js . 3100
                  displayName: 'Prueba de humo en QA'
                  workingDirectory: '$(Pipeline.Workspace)/deploy-qa/incident-hub'

  - stage: Produccion
    displayName: 'Despliegue a Produccion'
    dependsOn: QA
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    variables:
      - group: incident-hub-secrets
    jobs:
      - deployment: DeployProd
        displayName: 'Desplegar y validar en Produccion'
        environment: 'incident-hub-prod'   # La aprobacion manual se configura en el Environment
        strategy:
          runOnce:
            deploy:
              steps:
                - task: NodeTool@0
                  inputs:
                    versionSpec: $(nodeVersion)
                - task: ExtractFiles@1
                  displayName: 'Extraer artefacto'
                  inputs:
                    archiveFilePatterns: '$(Pipeline.Workspace)/incident-hub/*.zip'
                    destinationFolder: '$(Pipeline.Workspace)/deploy-prod'
                    cleanDestinationFolder: true
                - script: node -e "if(!process.env.DATABASE_URL){console.error('Falta el secreto DATABASE_URL');process.exit(1)}console.log('Secreto DATABASE_URL disponible (valor oculto)')"
                  displayName: 'Verificar secretos del ambiente'
                  env:
                    DATABASE_URL: $(DATABASE_URL)
                - script: npm ci --omit=dev
                  displayName: 'Instalar dependencias de produccion'
                  workingDirectory: '$(Pipeline.Workspace)/deploy-prod/incident-hub/backend'
                - script: node devops/validar-despliegue.js . 3200
                  displayName: 'Prueba de humo en Produccion'
                  workingDirectory: '$(Pipeline.Workspace)/deploy-prod/incident-hub'
                - script: echo Version $(Build.SourceBranchName) liberada en Produccion
                  displayName: 'Registrar liberacion'
